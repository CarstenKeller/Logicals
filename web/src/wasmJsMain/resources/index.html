<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Kein Seiten-Zoom durch Safari: Zoomen übernimmt das Spielfeld selbst. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Logicals</title>
    <meta name="description" content="Logikrätsel: Sudoku, Kakuro, Futoshiki, KenKen, Skyscraper, Catsweeper">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Logicals">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#fffbfe" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1b1f" media="(prefers-color-scheme: dark)">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #fffbfe;
            /* Safari: keine Textauswahl, kein Lupen-/Langdruck-Menü, kein Doppeltipp-Zoom. */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background-color: #1c1b1f; }
            #loading { color: #e6e1e5; }
        }
        /* Spielfläche innerhalb der sicheren Bereiche (Notch, Home-Indikator). */
        #app {
            position: fixed;
            top: env(safe-area-inset-top);
            right: env(safe-area-inset-right);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
        }
        #loading {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font: 16px -apple-system, system-ui, sans-serif;
            color: #1c1b1f;
            background: inherit;
            text-align: center;
            padding: 24px;
        }
        #loading .error { color: #b3261e; max-width: 32em; }
    </style>
    <script>
        // Von der CI ersetzt (Build-Nummer).
        globalThis.LOGICALS_VERSION = "@VERSION@";
    </script>
</head>
<body>
<div id="loading">
    <div><strong>Logicals</strong></div>
    <div id="loading-text">wird geladen …</div>
</div>
<div id="app"></div>
<script>
    // Fehler beim Start sichtbar machen (auf dem iPhone gibt es keine Konsole).
    function showStartError(message) {
        var box = document.getElementById("loading-text");
        if (!box || box.className === "error") return;
        box.className = "error";
        box.textContent = "Die App konnte nicht starten. Bitte auf „Neu laden“ tippen – gespeicherte " +
            "Spielstände bleiben erhalten. Hilft das nicht, wird ein aktuelles iOS (ab 18.2) bzw. ein " +
            "aktueller Browser benötigt. Details: " + message;
        var button = document.createElement("button");
        button.textContent = "Neu laden";
        button.style.cssText = "margin-top:16px;padding:10px 20px;font:inherit;border-radius:20px;" +
            "border:0;background:#3949ab;color:#fff";
        button.onclick = resetAndReload;
        box.parentNode.appendChild(button);
    }
    // Löscht nur zwischengespeicherte Programmdateien und den Service Worker, nicht den localStorage.
    function resetAndReload() {
        var steps = [];
        if (window.caches) {
            steps.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
        }
        if (navigator.serviceWorker) {
            steps.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
        }
        Promise.all(steps).catch(function () {}).then(function () { location.reload(); });
    }
    window.addEventListener("error", function (e) { showStartError(e.message || String(e)); });
    window.addEventListener("unhandledrejection", function (e) {
        showStartError((e.reason && (e.reason.message || e.reason)) || "unbekannt");
    });
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("Service Worker:", e); });
        });
    }
</script>
<script type="application/javascript" src="logicals.js?v=@VERSION@"></script>
</body>
</html>
