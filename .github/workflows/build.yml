name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests der Rätsel-Logik (JVM und Wasm)
        run: ./gradlew :core:allTests

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: logicals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK für Release umbenennen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk logicals-build-${{ github.run_number }}.apk

      - name: Als GitHub-Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Logicals Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Debug-APK aus Commit ${{ github.sha }} (Branch ${{ github.ref_name }}).
            Installation: APK auf dem Handy öffnen und Installation aus unbekannten Quellen erlauben.
          files: logicals-build-${{ github.run_number }}.apk
          make_latest: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Web-App bauen
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: Build-Nummer eintragen und Größe protokollieren
        run: |
          DIST=web/build/dist/wasmJs/productionExecutable
          sed -i "s/@VERSION@/1.0.${{ github.run_number }}/" "$DIST/index.html" "$DIST/sw.js"
          echo "Dateien (Bytes / gzip-Bytes):"
          find "$DIST" -type f | sort | while read -r f; do
            printf '%10d %10d  %s\n' "$(stat -c %s "$f")" "$(gzip -9 -c "$f" | wc -c)" "${f#$DIST/}"
          done
          echo "Gesamt: $(du -sb "$DIST" | cut -f1) Bytes, gzip: $(tar -C "$DIST" -cf - . | gzip -9 | wc -c) Bytes"

      - name: Starttest im Headless-Chrome
        run: |
          DIST=web/build/dist/wasmJs/productionExecutable
          mkdir -p /tmp/site && cp -r "$DIST" /tmp/site/Logicals
          (cd /tmp/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=30000 \
            --dump-dom http://localhost:8080/Logicals/ > /tmp/dom.html 2>/tmp/chrome.log || true
          # Gelungener Start: Die App entfernt den Ladehinweis.
          if grep -q 'id="loading"' /tmp/dom.html; then
            echo "Ladehinweis noch vorhanden – App nicht gestartet:"
            grep -o '<div id="loading-text"[^<]*<' /tmp/dom.html || true
            tail -n 30 /tmp/chrome.log
            exit 1
          fi
          echo "App gestartet."

      - uses: actions/upload-artifact@v4
        with:
          name: logicals-web
          path: web/build/dist/wasmJs/productionExecutable

      - name: Für GitHub Pages bereitstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy-web:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
