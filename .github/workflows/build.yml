name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests der Rätsel-Logik
        run: ./gradlew :core:test

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: logicals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK für Release umbenennen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk logicals-build-${{ github.run_number }}.apk

      - name: Als GitHub-Release veröffentlichen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Logicals Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Debug-APK aus Commit ${{ github.sha }} (Branch ${{ github.ref_name }}).
            Installation: APK auf dem Handy öffnen und Installation aus unbekannten Quellen erlauben.
          files: logicals-build-${{ github.run_number }}.apk
          make_latest: true
